<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 DRILL 2</title>
    <style>
    body{
        font-family: Consolas;
        background-color: #f5f0e8;
    }
    h1,p{
    	text-align: center;
    }
    section{
    	background-color: #fff;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: 0 auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    body{
        font-family: Consolas;
        background-color: #f5f0e8;
    }
    img{
            height: 150px;
            width: 220px;
            border-radius: 15px;
            display: block;
            margin: 0 auto;
       }
    input[type="text"], select, textarea, input[type= "submit"] {
    	width: 94%;
    	padding: 15px;
    	border: 1px solid #ccc;
    	border-radius: 5px;
    	text-align: center;
        display: block;
        margin: 0 auto;
    }
    </style>
</head>
<body>
    <section>

    <h1 style="color: firebrick;">RATE A MOVIE</h1>
    <br>

    <p>Enjoyed a movie? Drop your, thoughts, ratings, or reviews! 🎬🍿</p>

        <img src="https://png.pngtree.com/png-vector/20260128/ourmid/pngtree-red-background-white-circle-black-movie-projector-red-reels-white-film-png-image_18307736.webp" alt="logo">
        <br>
        <label for="">Movie Title</label>
        <br>
        <input type="text"
        id="movie" name="movie"
        placeholder="Type here...">

        <br><br>

        <label for="genre">Genre/s</label>
        <br>

        <input type="checkbox" id="Genre1" name="Genre1">
        <label for="Genre1">Action</label>

        <input type="checkbox" id="Genre2" name="Genre2">
        <label for="Genre2">Drama</label>

        <input type="checkbox" id="Genre3" name="Genre3">
        <label for="Genre3">Comedy</label>

        <input type="checkbox" id="Genre4" name="Genre4">
        <label for="Genre4">Fantasy</label>

        <input type="checkbox" id="Genre5" name="Genre5">
        <label for="Genre5">Horror</label>
        
        <br><br>

        <label for="rating">Rating</label>
        <br>

        <input type="radio" id="rate1" name="rate">
        <label for="rate">⭐️</label>

        <input type="radio" id="rate2" name="rate">
        <label for="rate">⭐️⭐️</label>

        <input type="radio" id="rate3" name="rate">
        <label for="rate">⭐️⭐️⭐️</label>

        <input type="radio" id="rate4" name="rate">
        <label for="rate">⭐️⭐️⭐️⭐️</label>

        <input type="radio" id="rate5" name="rate">
        <label for="rate">⭐️⭐️⭐️⭐️⭐️</label>
        <br><br>

        <textarea id="review" placeholder="Write a review" rows="4" cols="40"></textarea>

        <br>
        <input type="submit" id="submit" value="Submit Review">

        <br>
        Click <a href="link here" target="_blank">here</a> for more details.
</section>

</body>
</html>
